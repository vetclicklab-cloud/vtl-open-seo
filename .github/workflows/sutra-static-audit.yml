name: Sutra read-only source inventory (temporary)
on:
  push:
    branches:
      - audit/sutra-comprehensive-2026-11
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Inventory static branding, redirects, integrations and API dependencies
        run: python3 scripts/sutra-audit-scan.py
