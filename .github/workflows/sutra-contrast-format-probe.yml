name: Sutra contrast formatting probe (temporary)
on:
  push:
    branches:
      - fix/sutra-wcag22-contrast-controls
permissions:
  contents: read
jobs:
  formatting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/client/components/ui/combobox.tsx src/client/styles/brandContrast.test.ts
      - run: git diff -- src/client/components/ui/combobox.tsx src/client/styles/brandContrast.test.ts
