name: Deploy OpenSEO (VetClickLab Cloudflare)

# Run manually after reviewing changes. No PR or push can deploy with secrets.
on:
  workflow_dispatch:
    inputs:
      bootstrap_state_store:
        description: "First deployment only: initialize Alchemy state store"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: vetclicklab-openseo-selfhost
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'vetclicklab-cloud/vtl-open-seo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      CLOUDFLARE_ACCOUNT_ID: "8b6a4e421128b4d292c77a8a0ddaf1fb"
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      DATAFORSEO_API_KEY: ${{ secrets.DATAFORSEO_API_KEY }}

    steps:
      - name: Validate deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN DATAFORSEO_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions repository secret: $name"
              exit 1
            fi
          done

      - name: Check out reviewed main branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare self-host configuration (never commit secrets)
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'DATAFORSEO_API_KEY=%s\nAUTH_MODE=password\nWORKERS_SUBDOMAIN=vetclicklab.workers.dev\nOPENSEO_TELEMETRY_DISABLED=1\n' "$DATAFORSEO_API_KEY" > .env.selfhost
          chmod 600 .env.selfhost

      - name: Bootstrap Alchemy state store (first run only)
        if: ${{ inputs.bootstrap_state_store }}
        run: pnpm alchemy cloudflare bootstrap

      - name: Build and deploy official self-host stack
        run: pnpm deploy:selfhost --yes

      - name: Verify deployed health endpoint
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 6 --retry-delay 5 \
            --output /dev/null \
            --write-out 'Health endpoint HTTP %{http_code}\n' \
            https://open-seo-selfhost.vetclicklab.workers.dev/api/health

      - name: Deployment URL
        run: echo "OpenSEO URL: https://open-seo-selfhost.vetclicklab.workers.dev"
